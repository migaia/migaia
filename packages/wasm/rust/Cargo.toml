

[lib]
crate-type = ["cdylib", "rlib"]

[package]
name = "wasm-provider"
version = "0.1.0"
edition = "2024"

[dependencies]
console_error_panic_hook = "0.1.7"
wasm-bindgen = "0.2.126"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1.3"
serde-transcode = "1.1"

[profile.release]
# 速度优先。曾用 opt-level="z" 压体积，实测转码慢了一倍多——这个模块的存在
# 理由就是速度，为体积牺牲速度等于取消它自己。
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[dev-dependencies]
wasm-bindgen-test = "0.3"
serde_json = "1"
