openapi: 3.1.0
info:
  title: Orders
  version: 1.0.0
paths:
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, closed]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
    post:
      operationId: createOrder
      tags: [orders]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
  /orders/{id}:
    delete:
      operationId: deleteOrder
      tags: [orders]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: deleted
components:
  schemas:
    Order:
      type: object
      required: [id, customer]
      properties:
        id:
          type: string
        customer:
          type: string
          minLength: 1
        status:
          type: string
          enum: [open, closed]
        createdAt:
          type: string
          format: date-time
        reference:
          type: string
          pattern: '^R'
        external:
          $ref: 'other.yaml#/Thing'
    OrderLine:
      type: object
      required: [orderId]
      properties:
        orderId:
          type: string
    Note:
      type: object
      properties:
        text:
          type: string
