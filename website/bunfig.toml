[run]
# Node-shebang CLIs (react-router, vite, pagefind) run on bun; the website needs no Node runtime.
# Bun ignores NODE_OPTIONS, so `react-router dev` cannot relaunch itself with the `development`
# export condition; the package.json dev script passes `--conditions=development` to bun instead.
bun = true

[install]
backend = "bun"

[resolve]
alias = { "@migaia/utils" = "../packages/utils/dist", "@migaia/lifecycle" = "../packages/lifecycle/dist", "@migaia/middleware-pipeline" = "../packages/middleware-pipeline/dist", "@migaia/plugin-host" = "../packages/plugin-host/dist", "@migaia/reactive" = "../packages/reactive/dist", "@migaia/resource" = "../packages/resource/dist", "@migaia/serialize" = "../packages/serialize/dist", "@migaia/storage-contract" = "../packages/storage-contract/dist", "@migaia/storage-web" = "../packages/storage-web/dist", "@migaia/web-rpc" = "../packages/web-rpc/dist", "@migaia/event-subscriber" = "../packages/event-subscriber/dist" }
