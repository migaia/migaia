# Builds the static documentation image and pushes it to GHCR (private package).
# Only changes that alter the served site trigger it; tests, scripts, package.json,
# bun.lock and tooling config do not. Use "Run workflow" to rebuild manually.
name: website-image

on:
  push:
    branches: [main]
    paths:
      - 'website/app/**'
      - 'website/src/**'
      - '!website/src/scripts/**'
      - 'website/react-router.config.ts'
      - 'website/vite.config.ts'
      - 'website/site-base.ts'
      - 'website/tailwind.config.ts'
      - 'website/tsconfig.json'
      - 'website/Dockerfile'
      - 'website/.dockerignore'
      - 'website/docker/Caddyfile'
      - '.github/workflows/website-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: website-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/migaia-website
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: website
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
