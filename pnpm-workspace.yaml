packages:
  - apps/*
  - packages/*
  - website

allowBuilds:
  cbor-extract: set this to true or false
  esbuild: true
  fsevents: true
  msgpackr-extract: set this to true or false

minimumReleaseAgeExclude:
  - '@astrojs/internal-helpers@0.10.4'
  - '@astrojs/markdown-satteri@0.3.7'
  - '@astrojs/react@6.0.4'
  - astro@7.2.4
